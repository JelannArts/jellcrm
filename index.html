<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly plan</title>
<style>
:root{color-scheme:dark;--bg:#0C0D0B;--card:#151713;--ink:#EDEDE6;--mut:#8D9085;--line:#272a23;--col:#11130f;--accent:#E3B341;--green:#5FBF8A;--red:#E5675C;--now:#181710;--nowline:#4a4020;--doing:#1d1a0e;--doingink:#E3B341;--done:#14231a;--doneink:#7fd1a0;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px 48px}
h1{margin:0;font-size:36px;font-weight:500;letter-spacing:-.01em}
h1,.brand b,.stat .v{font-family:var(--serif);font-weight:500}
h1 em{font-style:italic;color:var(--accent)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.brand b{font-size:20px}.brand span{color:var(--mut);font-size:13px}
.sub{color:var(--mut);margin:4px 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.stat .l{color:var(--mut);font-size:13px}
.stat .v{font-size:34px;letter-spacing:-.01em;margin:6px 0}
.stat .n{color:var(--mut);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
select,.ctl input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.hint{color:var(--mut);font-size:12.5px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.pri{background:var(--accent);color:#0C0D0B;border-color:var(--accent);font-weight:600}
.board{display:flex;gap:14px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.col{flex:0 0 288px;background:var(--col);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:140px}
.col.now{background:var(--now);border-color:var(--nowline)}
.col.plan{background:transparent;border-style:dashed}
.col.late{border-color:var(--red)}
.col.over{outline:2px solid var(--accent);outline-offset:2px}
.ch{display:flex;justify-content:space-between;gap:8px}
.ch .t{font-size:12px;font-weight:600;color:var(--mut)}
.col.now .t{color:var(--doingink)}.col.late .t{color:var(--red)}
.ch .d{font-weight:700;font-size:15px}
.ch .m{text-align:right;color:var(--mut);font-size:12px}
.ch .m b{display:block;color:var(--ink);font-size:15px}
.cs{color:var(--mut);font-size:12px;margin-top:2px}
.goal{display:block;width:100%;background:none;border:0;border-radius:6px;padding:8px 0 4px;color:var(--mut);font-size:12.5px}
.goal:focus{outline:2px solid var(--accent);padding:8px 6px 4px;color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:grab}
.card.doing{background:var(--doing);border-color:var(--nowline)}
.card.dragging{opacity:.4}
.row{display:flex;align-items:center;gap:8px}
.nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.card.done .nm{text-decoration:line-through;color:var(--mut)}
.ck{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--mut);background:none;cursor:pointer;padding:0}
.card.doing .ck{border-color:var(--accent)}
.card.done .ck{background:var(--green);border-color:var(--green)}
.mv{display:flex;gap:2px;opacity:.55}
.card:hover .mv,.card:focus-within .mv{opacity:1}
.mv button{background:none;border:0;cursor:pointer;color:var(--mut);padding:0 4px;font-size:16px;line-height:1}
.mv button:hover{color:var(--ink)}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mut)}
.pill{border:0;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--col);color:var(--mut);cursor:pointer}
.card.doing .pill{background:var(--doing);color:var(--doingink)}
.card.done .pill{background:var(--done);color:var(--doneink)}
.add{display:block;width:100%;margin-top:8px;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px;color:var(--mut);cursor:pointer}
.add:hover{color:var(--ink);border-color:var(--mut)}
.form{margin-top:8px;display:grid;gap:6px}
.form input,.form select{width:100%}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.empty{color:var(--mut);font-size:12.5px;padding:10px 2px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--mut)}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mut);cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--mut)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0C0D0B;font-weight:600}
.chk{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.chk input{width:auto}
.tot{color:var(--mut);font-size:13px}.tot b{color:var(--ink)}
.key{color:var(--mut);font-size:12.5px;margin:-6px 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top .sub{margin:4px 0 0}
.btn.big{padding:11px 18px;font-size:15px}
.welcome{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px dashed var(--mut);border-radius:18px;padding:22px;margin-bottom:20px}
.welcome h2{margin:0 0 6px;font:500 22px var(--serif)}.welcome p{margin:0;color:var(--mut);max-width:60ch}
.cl{color:var(--mut);font-size:12.5px;margin:2px 0 0 26px}
.sub2{color:var(--mut);font-size:12px;margin-top:6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10}
.dlg{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px}
.dlg h2{margin:0;font:500 26px var(--serif)}
.fld{display:grid;gap:6px;font-size:13px;color:var(--mut)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);width:100%}
.fld input.bad{border-color:var(--red)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkc{position:relative;display:block}
.pkc input{position:absolute;opacity:0;width:1px;height:1px}
.pkc span{display:grid;gap:2px;height:100%;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.pkc b{color:var(--ink);font-size:13px}.pkc i{font:500 22px var(--serif);color:var(--ink)}.pkc small{font-size:11.5px}
.pkc input:checked+span{border-color:var(--accent);background:var(--now);box-shadow:0 0 0 1px var(--accent)}
.pkc input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.step{display:flex;gap:6px}.step input{width:72px;text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.foot .tot b{font:500 26px var(--serif)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{color:var(--red);border-color:var(--red)}
@media (max-width:480px){.pk{grid-template-columns:1fr}}
.fld textarea{resize:vertical;font:inherit;min-height:60px}
.paste{display:grid;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px}
.rfq{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rfq summary{cursor:pointer;font-weight:600}
.rfqb{display:grid;gap:12px;margin-top:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.col{flex-basis:84vw}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script>
const CATS=['Cartoony','Anime','Grunge','Semi-realism'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const mon=()=>{const n=new Date(),x=new Date(n.getFullYear(),n.getMonth(),n.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)};
const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const THIS=mon(),wk=n=>key(addDays(THIS,7*n)),W0=wk(0);
const STORE='weekly-plan.jelann.v2';
const PKG={starter:{name:'Starter',price:65,revs:1,time:'~1–2 weeks'},standard:{name:'Standard',price:90,revs:2,time:'~5–7 days'},pro:{name:'Professional',price:150,revs:3,time:'3–5 days'}};
const ORDER=['starter','standard','pro'];
const price=x=>PKG[x.pkg].price*(1+(x.rush?.25:0)+.1*(x.revs||0));

function seed(){return{project:'p1',weeks:4,goals:{},projects:[{id:'p1',name:'Logo commissions'}],items:[]}}
let S;
try{S=JSON.parse(localStorage.getItem(STORE))}catch(e){S=null}
if(!S||!S.items)S=seed();
S.items=S.items.filter(x=>!/^i\d{1,2}$/.test(x.id));
S.projects=S.projects.filter(p=>!(p.id==='p2'&&p.name==='Studio clients'));
if(!S.projects.some(p=>p.id===S.project))S.project=S.projects[0].id;
S.items=S.items.filter(x=>S.projects.some(p=>p.id===x.p));
const ui={adding:null,newProj:false};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}};
const mine=()=>S.items.filter(x=>x.p===S.project);

function columns(){
  const items=mine(),cols=[],late=items.filter(x=>x.week&&x.week<W0&&x.status!=='done');
  if(late.length)cols.push({id:'late',cls:'late',label:'Overdue',sub:'Past their week',items:late});
  cols.push({id:'none',cls:'plan',label:'No target week',sub:'Not scheduled',items:items.filter(x=>!x.week)});
  for(let n=0;n<S.weeks;n++){
    const k=wk(n),a=addDays(THIS,7*n),b=addDays(a,6);
    cols.push({id:k,week:k,cls:n?'':'now',label:n==0?'This week':n==1?'Next week':'In '+n+' weeks',
      range:fmt(a)+' to '+fmt(b),wn:isoWeek(a),items:items.filter(x=>x.week===k)});
  }
  return cols;
}

function card(x){
  const lab={todo:'To do',doing:'Doing',done:'Done'}[x.status],p=PKG[x.pkg],n=p.revs+(x.revs||0);
  const sub=[p.name,x.rush?'Rush':'',n+(n==1?' revision':' revisions')].filter(Boolean).join(', ');
  return `<div class="card ${x.status}" draggable="true" data-id="${x.id}" data-a="edit" tabindex="0" aria-label="Edit ${esc(x.name)}">
    <div class="row"><button class="ck" data-a="done" aria-label="Mark delivered"></button><span class="nm">${esc(x.name)}</span>
    <span class="mv"><button data-a="prev" aria-label="Move earlier">‹</button><button data-a="next" aria-label="Move later">›</button></span></div>
    ${(x.client||x.discord)?`<div class="cl">${esc([x.client,x.discord].filter(Boolean).join(', '))}</div>`:''}
    <div class="meta"><span class="tag">${esc(x.cat)}</span><b>${money(price(x))}</b><button class="pill" data-a="cycle">${lab}</button></div>
    <div class="sub2">${sub}${x.deadline?'. Deadline: '+esc(x.deadline):''}</div></div>`;
}

function colHtml(c){
  const done=c.items.filter(x=>x.status==='done').length,cost=c.items.reduce((s,x)=>s+price(x),0);
  const sorted=[...c.items].sort((a,b)=>(a.status==='done')-(b.status==='done'));
  const drop=c.id!=='late';
  const head=c.week
    ?`<div class="ch"><div><div class="t">${c.label}</div><div class="d">${c.range}</div><div class="cs">${done} of ${c.items.length} delivered</div></div><div class="m"><b>${money(cost)}</b>week ${c.wn}</div></div>
      <div class="bar"><i style="width:${c.items.length?done/c.items.length*100:0}%"></i></div>
      <input class="goal" data-goal="${c.week}" value="${esc(S.goals[c.week]||'')}" placeholder="+ set a goal for this week" aria-label="Goal for ${c.range}">`
    :`<div class="t" style="font-size:12px;font-weight:600;color:var(--mut)">${c.label}</div><div class="cs">${c.items.length} waiting</div>`;
  const form=drop?`<button class="add" data-a="new" data-col="${c.id}">+ Add logo</button>`:'';
  return `<section class="col ${c.cls}" ${drop?`data-week="${c.id}"`:''}>${head}<div class="cards">${sorted.map(card).join('')||(drop?'<div class="empty">Nothing here yet. Drag a card in.</div>':'')}</div>${form}</section>`;
}

function render(){
  const items=mine(),due=items.filter(x=>x.week===W0),delivered=due.filter(x=>x.status==='done').length;
  const behind=items.filter(x=>x.week&&x.week<W0&&x.status!=='done').length;
  const landing=due.reduce((s,x)=>s+price(x),0);
  document.getElementById('app').innerHTML=`
  <div class="brand"><b>Jelann Arts</b><span>Logo commissions board</span></div>
  <div class="top"><div><h1>Weekly <em>plan.</em></h1><p class="sub">${fmt(THIS)} to ${fmt(addDays(THIS,6))}, ${due.length} due, ${delivered} delivered, ${behind} behind</p></div><button class="btn pri big" data-a="new">+ New logo</button></div>
  <div class="stats">
    <div class="stat"><div class="l">Due this week</div><div class="v">${due.length}</div><div class="bar"><i style="width:${due.length?delivered/due.length*100:0}%"></i></div><div class="n">${delivered} delivered, ${due.length-delivered} still open</div></div>
    <div class="stat"><div class="l">Landing this week</div><div class="v">${money(landing)}</div><div class="n">${money(landing/2)} to start, ${money(landing/2)} on approval</div></div>
    <div class="stat"><div class="l">Behind schedule</div><div class="v" style="color:var(${behind?'--red':'--green'})">${behind}</div><div class="n">${behind?'Past their week and not delivered':'Nothing has slipped'}</div></div>
  </div>
  <div class="ctl">
    <select id="proj" aria-label="Project">${S.projects.map(p=>`<option value="${p.id}" ${p.id===S.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    ${ui.newProj?`<input id="np" placeholder="Project name"><button class="btn pri" data-a="np-save">Create</button><button class="btn" data-a="np-cancel">Cancel</button>`:`<button class="btn" data-a="np-open">+ New project</button>`}
    <select id="wks" aria-label="Weeks shown">${[3,4,6,8].map(n=>`<option value="${n}" ${n===S.weeks?'selected':''}>Show ${n} weeks</option>`).join('')}</select>
    <span class="hint">Click a card to edit it. Drag it to another week to reschedule.</span>
  </div>
  ${items.length?'':`<div class="welcome"><div><h2>Add your first logo</h2><p>Pick a package, choose a delivery week, and it lands on the board. Drag cards between weeks as plans change, and tick the circle when you deliver.</p></div><button class="btn pri big" data-a="new">+ Add your first logo</button></div>`}
  <p class="key">${ORDER.map(k=>PKG[k].name+' '+money(PKG[k].price)).join(', ')}. Rush adds 25% and each extra revision adds 10%, both of the package price.</p>
  <div class="board">${columns().map(colHtml).join('')}</div>`;
  if(ui.newProj)document.getElementById('np')?.focus();
}

function shift(x,d){
  if(!x.week){if(d>0)x.week=W0;return}
  if(x.week===W0&&d<0){x.week=null;return}
  const n=key(addDays(parse(x.week),7*d));
  if(n>wk(S.weeks-1))return;
  x.week=n<W0?W0:n;
}
function addProject(){
  const name=document.getElementById('np').value.trim();
  if(!name){document.getElementById('np').focus();return}
  const id='p'+Date.now();S.projects.push({id,name});S.project=id;ui.newProj=false;
}

const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,el=b.closest('.card'),x=el&&S.items.find(i=>i.id===el.dataset.id);
  if(a==='done'&&x)x.status=x.status==='done'?'todo':'done';
  else if(a==='cycle'&&x)x.status={todo:'doing',doing:'done',done:'todo'}[x.status];
  else if(a==='prev'&&x)shift(x,-1);
  else if(a==='next'&&x)shift(x,1);
  else if(a==='edit')openModal(el.dataset.id);
  else if(a==='new')openModal(null,b.dataset.col);
  else if(a==='pkg'&&x)x.pkg=ORDER[(ORDER.indexOf(x.pkg)+1)%3];
  else if(a==='rush'&&x)x.rush=!x.rush;
  else if(a==='rev'&&x)x.revs=(x.revs||0)+1;
  else if(a==='revdn'&&x)x.revs=Math.max(0,(x.revs||0)-1);
  
  
  
  else if(a==='np-open')ui.newProj=true;
  else if(a==='np-cancel')ui.newProj=false;
  else if(a==='np-save')addProject();
  save();render();
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='proj'){S.project=t.value;ui.adding=null}
  else if(t.id==='wks')S.weeks=+t.value;
  else if(t.dataset.goal){S.goals[t.dataset.goal]=t.value.trim();save();return}
  else return;
  save();render();
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const t=e.target;
  if(t.classList.contains('card'))openModal(t.dataset.id);
  else if(t.id==='np'){addProject();save();render()}
  else if(t.dataset.goal)t.blur();
});
app.addEventListener('input',e=>{
  if(!['f-pkg','f-rush','f-rev'].includes(e.target.id))return;
  const g=i=>document.getElementById(i);
  g('f-total').textContent=money(price({pkg:g('f-pkg').value,rush:g('f-rush').checked,revs:Math.max(0,parseInt(g('f-rev').value)||0)}));
});
let dragId=null;
app.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;dragId=c.dataset.id;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';setTimeout(()=>c.classList.add('dragging'),0)});
app.addEventListener('dragend',()=>{dragId=null;render()});
app.addEventListener('dragover',e=>{const c=e.target.closest('.col[data-week]');if(!c||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(n=>n!==c&&n.classList.remove('over'));c.classList.add('over')});
app.addEventListener('drop',e=>{
  const c=e.target.closest('.col[data-week]');if(!c||!dragId)return;e.preventDefault();
  const x=S.items.find(i=>i.id===dragId);
  if(x){x.week=c.dataset.week==='none'?null:c.dataset.week;save()}
});
const $=id=>document.getElementById(id);
function openModal(id,col){
  const x=id?S.items.find(i=>i.id===id):null;
  const v=x||{name:'',client:'',cat:CATS[0],pkg:'standard',rush:false,revs:0,week:col==null?W0:col==='none'?null:col};
  const wo=[['none','No target week']];
  for(let n=0;n<S.weeks;n++){const a=addDays(THIS,7*n);wo.push([wk(n),(n==0?'This week':n==1?'Next week':'In '+n+' weeks')+', '+fmt(a)+' to '+fmt(addDays(a,6))])}
  if(v.week&&!wo.some(o=>o[0]===v.week))wo.push([v.week,'Week of '+fmt(parse(v.week))]);
  const hasD=['discord','email','pay','idea','refs','deadline','notes'].some(k=>v[k]);
  ui.open=true;ui.edit=x?x.id:null;
  $('modal').innerHTML=`<div class="scrim" data-a="close"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">${x?'Edit logo':'New logo'}</h2>
    <div class="paste"><label class="fld">Paste an RFQ from your site<textarea id="m-paste" rows="3" placeholder="Package: Standard ($90)&#10;Rush order: Yes (+$22.50)&#10;Name: ..."></textarea></label><div class="row"><button class="btn" data-a="m-fill">Fill in from RFQ</button><span class="hint" id="m-fillmsg"></span></div></div>
    <label class="fld">Logo name<input id="m-name" value="${esc(v.name)}" placeholder="e.g. Hyper District" maxlength="80"></label>
    <label class="fld">Client name, optional<input id="m-client" value="${esc(v.client||'')}" placeholder="Name or studio" maxlength="80"></label>
    <div class="r2"><label class="fld">Style<select id="m-cat">${CATS.map(c=>`<option ${c===v.cat?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="fld">Delivery week<select id="m-week">${wo.map(o=>`<option value="${o[0]}" ${o[0]===(v.week||'none')?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>
    <div class="fld">Package<div class="pk">${ORDER.map(k=>`<label class="pkc"><input type="radio" name="pkg" value="${k}" ${k===v.pkg?'checked':''}><span><b>${PKG[k].name}</b><i>${money(PKG[k].price)}</i><small>${PKG[k].revs} ${PKG[k].revs==1?'revision':'revisions'}, ${PKG[k].time}</small></span></label>`).join('')}</div></div>
    <label class="chk"><input id="m-rush" type="checkbox" ${v.rush?'checked':''}> Rush order, adds 25%</label>
    <div class="fld">Extra revisions, 10% each<div class="step"><button class="btn" data-a="rv-" aria-label="Fewer revisions">−</button><input id="m-rev" type="number" min="0" value="${v.revs||0}"><button class="btn" data-a="rv+" aria-label="More revisions">+</button></div></div>
    <details class="rfq" ${hasD?'open':''}><summary>RFQ details</summary><div class="rfqb">
      <div class="r2"><label class="fld">Discord<input id="m-discord" value="${esc(v.discord||'')}" maxlength="80"></label><label class="fld">Email<input id="m-email" type="email" value="${esc(v.email||'')}" maxlength="120"></label></div>
      <div class="r2"><label class="fld">Payment method<input id="m-pay" value="${esc(v.pay||'')}" placeholder="e.g. Crypto" maxlength="60"></label><label class="fld">Client deadline<input id="m-deadline" value="${esc(v.deadline||'')}" maxlength="80"></label></div>
      <label class="fld">Idea<textarea id="m-idea" rows="3">${esc(v.idea||'')}</textarea></label>
      <label class="fld">References<textarea id="m-refs" rows="2">${esc(v.refs||'')}</textarea></label>
      <label class="fld">Notes<textarea id="m-notes" rows="2">${esc(v.notes||'')}</textarea></label>
    </div></details>
    <div class="foot"><div class="tot">Total <b id="m-total"></b></div><div class="acts">${x?'<button class="btn danger" data-a="m-del">Delete</button>':''}<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="m-save">${x?'Save changes':'Add logo'}</button></div></div></div>`;
  mTotal();$('m-name').focus();
}
function mVals(){return{pkg:document.querySelector('input[name=pkg]:checked').value,rush:$('m-rush').checked,revs:Math.max(0,parseInt($('m-rev').value)||0)}}
function mTotal(){$('m-total').textContent=money(price(mVals()))}
function closeModal(){ui.open=false;$('modal').innerHTML=''}
function saveModal(){
  const name=$('m-name').value.trim();
  if(!name){$('m-name').classList.add('bad');$('m-name').focus();return}
  const w=$('m-week').value,f={name,client:$('m-client').value.trim(),cat:$('m-cat').value,week:w==='none'?null:w,...mVals(),
    discord:$('m-discord').value.trim(),email:$('m-email').value.trim(),pay:$('m-pay').value.trim(),deadline:$('m-deadline').value.trim(),
    idea:$('m-idea').value.trim(),refs:$('m-refs').value.trim(),notes:$('m-notes').value.trim()};
  if(ui.edit)Object.assign(S.items.find(i=>i.id===ui.edit),f);
  else S.items.push({id:'i'+Date.now(),p:S.project,status:'todo',...f});
  closeModal();save();render();
}
const RFQ_KEYS={'package':'pkg','rush order':'rush','rush':'rush','additional revisions':'revs','extra revisions':'revs','estimated total':'total','payment method':'pay','payment':'pay','idea':'idea','references':'refs','deadline':'deadline','notes':'notes','name':'name','discord':'discord','email':'email'};
function parseRFQ(t){
  const o={};let k=null;
  t.split(/\r?\n/).forEach(l=>{
    const m=l.match(/^\s*([A-Za-z ]{2,24}?)\s*:\s*(.*)$/),key=m&&RFQ_KEYS[m[1].trim().toLowerCase()];
    if(key){k=key;o[k]=m[2].trim()}else if(k&&l.trim())o[k]+='\n'+l.trim();
  });
  return o;
}
function fillRFQ(){
  const o=parseRFQ($('m-paste').value),set=(id,v)=>{if(v)$(id).value=v},msg=$('m-fillmsg');
  if(!Object.keys(o).length){msg.textContent='No "Label: value" lines found.';return}
  const pk=ORDER.find(k=>new RegExp(PKG[k].name,'i').test(o.pkg||''));
  if(pk)document.querySelector('input[name=pkg][value='+pk+']').checked=true;
  if(o.rush!=null)$('m-rush').checked=/^\s*y/i.test(o.rush);
  if(o.revs!=null)$('m-rev').value=parseInt(o.revs)||0;
  set('m-client',o.name);set('m-discord',o.discord);set('m-email',o.email);set('m-pay',o.pay);
  set('m-idea',o.idea);set('m-refs',o.refs);set('m-deadline',o.deadline);set('m-notes',o.notes);
  if(!$('m-name').value.trim()&&o.name)$('m-name').value='Logo for '+o.name;
  const d=o.deadline&&new Date(/\d{4}/.test(o.deadline)?o.deadline:o.deadline+' '+THIS.getFullYear());
  if(d&&!isNaN(d)){const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-(m.getDay()+6)%7);const w=key(m);if([...$('m-week').options].some(x=>x.value===w))$('m-week').value=w}
  document.querySelector('.rfq').open=true;mTotal();
  const q=parseFloat((o.total||'').replace(/[^0-9.]/g,'')),c=price(mVals());
  msg.textContent='Filled in.'+(q&&Math.abs(q-c)>.01?' The RFQ total was '+money(q)+', but these packages price it at '+money(c)+'.':'');
}
$('modal').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='close')closeModal();
  else if(a==='m-save')saveModal();
  else if(a==='m-fill')fillRFQ();
  else if(a==='rv-'||a==='rv+'){$('m-rev').value=Math.max(0,(parseInt($('m-rev').value)||0)+(a==='rv+'?1:-1));mTotal()}
  else if(a==='m-del'){
    if(b.dataset.sure){S.items=S.items.filter(i=>i.id!==ui.edit);closeModal();save();render()}
    else{b.dataset.sure=1;b.textContent='Click again to confirm'}
  }
});
$('modal').addEventListener('input',e=>{e.target.classList.remove('bad');mTotal()});
$('modal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!['radio','checkbox'].includes(e.target.type))saveModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.open)closeModal()});
render();
</script>
</body>
</html>

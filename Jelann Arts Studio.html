<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Jelann Arts Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#111214;--pn:#181a1d;--pn2:#1f2226;--bd:#2a2d32;--tx:#e8e9eb;--mu:#8b9098;--ac:#c9a86a;--rd:#e5675f;--gn:#5fb37c;--yl:#d9b24c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme=dark]){}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}
nav{width:200px;flex:none;background:var(--pn);border-right:1px solid var(--bd);padding:16px 10px;overflow:auto}
nav h1{font-size:15px;margin:0 8px 14px;letter-spacing:.3px}nav h1 span{color:var(--ac)}
nav small{display:block;color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin:14px 8px 4px}
nav a{display:block;padding:6px 8px;border-radius:6px;color:var(--mu);cursor:pointer}nav a:hover{background:var(--pn2)}nav a.on{background:var(--pn2);color:var(--tx)}
main{flex:1;overflow:auto;padding:20px 24px 90px;min-width:0}
h2{font-size:20px;margin:0 0 14px;font-weight:600}h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin:22px 0 8px;font-weight:600}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
textarea{width:100%;min-height:80px;resize:vertical}input,select{width:100%}
button{cursor:pointer;width:auto}button:hover{border-color:#444a52}
.pri{background:var(--ac);color:#15120b;border-color:var(--ac);font-weight:600}.sm{padding:3px 8px;font-size:12px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}.col{flex:0 0 220px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:120px}
.col h4{margin:0 0 8px;font-size:12px;color:var(--mu);display:flex;justify-content:space-between}
.lc{background:var(--pn2);border:1px solid var(--bd);border-radius:7px;padding:9px;margin-bottom:8px;cursor:grab}
.lc b{display:block}.mu{color:var(--mu);font-size:12px}.lc .row{margin-top:6px;gap:4px}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--bd);color:var(--mu)}
.due{color:var(--rd)}.big{font-size:26px;font-weight:600}
.alert{border-left:3px solid var(--rd)}.list>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto;z-index:9}
.md{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:18px;width:100%;max-width:560px}
.md label{display:block;color:var(--mu);font-size:12px;margin:10px 0 3px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tl div{padding:3px 0;color:var(--mu)}.tl b{color:var(--tx);font-weight:500}
.tab{display:none}
@media(max-width:760px){body{display:block}nav{position:fixed;bottom:0;left:0;right:0;width:auto;z-index:5;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);border-right:0;gap:2px}
nav h1,nav small{display:none}nav a{white-space:nowrap;padding:8px 10px}main{padding:14px 12px 90px;height:100%}.col{flex-basis:78vw}.f2{grid-template-columns:1fr}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="ov"></div>
<script>
const ST=["New","Contacted","Replied","Qualified","Quote Sent","Negotiating","Won","Lost"],PL=["Roblox","Fortnite","Minecraft","Unity","Unreal","Mobile","PC","Other"],SR=["X / Twitter","Reddit","Discord","Referral","Website","Returning Client","Other"];
const DT={"First Contact":"Hey {client}! I came across {game} and love the direction. I design game logos and would love to help give it a bold, memorable identity. Want to see some of my work?","Follow-up":"Hey {client}, just following up on {game}. Still looking for a logo? Happy to answer any questions!","Quote":"Hey {client}! For {game}, here's my quote: Standard $90 / Professional $150. Delivery works for {deadline}. Let me know which fits!","Revision":"Hey {client}, here's the updated {game} logo with your revisions. Let me know what you think!","Project Complete":"Hey {client}! Your {game} logo is complete. Thank you so much for working with me, and reach out anytime for future projects!"};
const NAV=[["CRM"],["dash","Dashboard"],["leads","Leads"],["clients","Clients"],["fu","Follow-ups"],["an","Analytics"],["Design"],["prog","Progression Analyzer"],["port","Portfolio Reviews"],["Settings"],["tpl","Templates"],["set","CRM Settings"],["data","Data"]];
let S;try{S=JSON.parse(localStorage.getItem("jas"))}catch(e){}
S=S||{leads:[],tpl:DT,pref:{platform:"Roblox",source:"X / Twitter"}};
let V="dash",F={q:"",stage:"",source:"",val:"",fu:""};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{try{localStorage.setItem("jas",JSON.stringify(S))}catch(e){}};
const iso=d=>d.toISOString().slice(0,10),TD=()=>iso(new Date()),add=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>s?new Date(s+"T00:00").toLocaleDateString("en",{month:"short",day:"numeric"}):"";
const G=id=>S.leads.find(l=>l.id==id),tot=l=>(+l.base||0)+(+l.rush||0)+(+l.rev||0),val=l=>tot(l)||+l.value||0;
function log(l,t){l.log.push({d:TD(),t})}
function mk(o){const l={id:Date.now()+Math.random(),name:"",project:"",platform:S.pref.platform,contact:"",source:S.pref.source,notes:[],stage:0,max:0,pkg:"",value:0,deadline:"",follow:"",log:[],created:TD(),...o};log(l,"Lead added");S.leads.unshift(l);return l}
function mv(l,i){l.stage=+i;if(i<7)l.max=Math.max(l.max,+i);log(l,"Moved to "+ST[i]);save()}
function toast(t){const e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ac);color:#111;padding:8px 14px;border-radius:8px;z-index:20";document.body.append(e);setTimeout(()=>e.remove(),1600)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()});toast("DM copied")}
function dm(l,name){name=name||["First Contact","Follow-up","Follow-up","Quote","Quote","Quote","Project Complete","Follow-up"][l.stage];copy((S.tpl[name]||"").replace(/{client}/g,l.name||"there").replace(/{game}/g,l.project||"your game").replace(/{deadline}/g,l.deadline?fd(l.deadline):"your timeline"));if(l.stage==0)mv(l,1);log(l,"DM sent ("+name+")");save()}
const opts=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${esc(x)}</option>`).join("");
function modal(h){$("#ov").innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">${h}</div></div>`}
function closeM(){$("#ov").innerHTML="";draw()}
function nav(){$("#nav").innerHTML=`<h1>Jelann <span>Arts</span></h1>`+NAV.map(n=>n.length==1?`<small>${n[0]}</small>`:`<a class="${V==n[0]?"on":""}" onclick="V='${n[0]}';draw()">${n[1]}</a>`).join("")}
function fuBadge(l){if(!l.follow)return"";const o=l.follow<=TD();return`<span class="${o?"due":"mu"}">${o?"⚠ ":""}Follow-up ${l.follow==TD()?"today":fd(l.follow)}</span>`}
function lcard(l){return`<div class="lc" draggable="true" ondragstart="event.dataTransfer.setData('t',${l.id})"><b>${esc(l.name||"Unnamed")}${l.project?" / "+esc(l.project):""}</b><div class="mu">${esc(l.platform)} ${val(l)?"· $"+val(l):""}</div><div>${fuBadge(l)}</div>
<div class="row"><button class="sm" onclick="dm(G(${l.id}))">DM</button><button class="sm" onclick="note(${l.id})">Note</button><button class="sm" onclick="fup(${l.id})">Follow</button><select class="sm" style="width:auto;padding:2px" onchange="mv(G(${l.id}),this.value);draw()">${ST.map((s,i)=>`<option value="${i}" ${i==l.stage?"selected":""}>${i==l.stage?"Move…":s}</option>`).join("")}</select><button class="sm" onclick="open_(${l.id})">Open</button></div></div>`}
function kanban(ls){return`<div class="kan">${ST.map((s,i)=>{const c=ls.filter(l=>l.stage==i);return`<div class="col" ondragover="event.preventDefault()" ondrop="mv(G(event.dataTransfer.getData('t')),${i});draw()"><h4>${s}<span>${c.length}</span></h4>${c.map(lcard).join("")}</div>`}).join("")}</div>`}
function dash(){const due=S.leads.filter(l=>l.follow&&l.follow<=TD()&&l.stage<6),q=S.leads.filter(l=>l.stage==4),act=S.leads.filter(l=>l.stage==6&&(l.pay||"")!="Fully paid");
const h=new Date().getHours();return`<h2>Good ${h<12?"morning":h<18?"afternoon":"evening"}, Jelann.</h2>
<div class="row" style="margin-bottom:14px"><button class="pri" onclick="quick()">+ Add Lead</button><span class="mu">Press <b>N</b> to add · <b>Ctrl/⌘+K</b> to search</span></div>
<h3>Today</h3><div class="grid"><div class="card"><span class="big">🔴 ${due.length}</span><div class="mu">follow-ups due</div></div><div class="card"><span class="big">🟡 ${q.length}</span><div class="mu">quotes awaiting response</div></div><div class="card"><span class="big">🟢 ${act.length}</span><div class="mu">active / unpaid projects</div></div></div>
${due.length?`<h3>Follow up today</h3><div class="card alert list">${due.map(l=>`<div><span><b>${esc(l.name)}</b> — ${esc(l.project)}<div class="mu">${ST[l.stage]} · due ${fd(l.follow)}</div></span><button class="sm" onclick="open_(${l.id})">Open</button></div>`).join("")}</div>`:""}
<h3>Pipeline</h3>${kanban(S.leads)}<h3>Recent leads</h3><div class="card list">${S.leads.slice(0,5).map(l=>`<div onclick="open_(${l.id})" style="cursor:pointer"><span><b>${esc(l.name)}</b> ${esc(l.project)}</span><span class="pill">${ST[l.stage]}</span></div>`).join("")||'<span class="mu">No leads yet. Press N.</span>'}</div>`}
function filt(){return S.leads.filter(l=>{const t=(l.name+l.project+l.contact+l.discord+l.x+l.email+l.notes.map(n=>n.t).join(" ")).toLowerCase(),v=val(l);
return(!F.q||t.includes(F.q.toLowerCase()))&&(!F.stage||ST[l.stage]==F.stage)&&(!F.source||l.source==F.source)&&(!F.val||(F.val=="a"?v<100:F.val=="b"?v>=100&&v<=250:v>250))&&(!F.fu||(F.fu=="none"?!l.follow:F.fu=="today"?l.follow==TD():F.fu=="over"?l.follow&&l.follow<TD():l.follow>TD()))})}
function leads(){const ls=filt();return`<h2>Leads</h2><div class="row" style="margin-bottom:12px"><button class="pri" onclick="quick()">+ Add Lead</button><input style="flex:1;min-width:140px" placeholder="Search…" value="${esc(F.q)}" oninput="F.q=this.value;draw(1)">
<select style="width:auto" onchange="F.stage=this.value;draw()"><option value="">Stage</option>${opts(ST,F.stage)}</select><select style="width:auto" onchange="F.source=this.value;draw()"><option value="">Source</option>${opts(SR,F.source)}</select>
<select style="width:auto" onchange="F.val=this.value;draw()"><option value="">Value</option><option value="a" ${F.val=="a"?"selected":""}>&lt;$100</option><option value="b" ${F.val=="b"?"selected":""}>$100–$250</option><option value="c" ${F.val=="c"?"selected":""}>$250+</option></select>
<select style="width:auto" onchange="F.fu=this.value;draw()"><option value="">Follow-up</option>${[["today","Today"],["over","Overdue"],["up","Upcoming"],["none","None"]].map(o=>`<option value="${o[0]}" ${F.fu==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>${kanban(ls)}`}
function clients(){const ws=S.leads.filter(l=>l.stage==6),by={};ws.forEach(l=>(by[l.name.toLowerCase()]=by[l.name.toLowerCase()]||[]).push(l));
return`<h2>Clients</h2><div class="card list">${Object.values(by).map(a=>`<div onclick="open_(${a[0].id})" style="cursor:pointer"><span><b>${esc(a[0].name)}</b><div class="mu">${a.map(x=>esc(x.project)).join(", ")} · last ${fd(a[0].log.at(-1).d)}</div></span><span>${a.length} project${a.length>1?"s":""} · $${a.reduce((s,l)=>s+val(l),0)}</span></div>`).join("")||'<span class="mu">Clients appear when a lead is moved to Won.</span>'}</div>`}
function fu(){const ls=S.leads.filter(l=>l.follow&&l.stage<6).sort((a,b)=>a.follow>b.follow?1:-1);return`<h2>Follow-ups</h2><div class="card list">${ls.map(l=>`<div><span><b>${esc(l.name)}</b> — ${esc(l.project)}<div>${fuBadge(l)} <span class="mu">· ${ST[l.stage]}</span></div></span><span class="row"><button class="sm" onclick="dm(G(${l.id}))">Copy DM</button><button class="sm" onclick="fup(${l.id})">Reschedule</button><button class="sm" onclick="open_(${l.id})">Open</button></span></div>`).join("")||'<span class="mu">Nothing scheduled.</span>'}</div>`}
function an(){const L=S.leads,mo=TD().slice(0,7),m=L.filter(l=>l.created.startsWith(mo)),c=(a,i)=>a.filter(l=>l.max>=i).length,won=m.filter(l=>l.stage==6),rev=won.reduce((s,l)=>s+val(l),0),pc=(a,b)=>b?Math.round(a/b*100)+"%":"—";
const d=[m.length,c(m,1),c(m,2),c(m,4),won.length],lb=["Leads","DMs","Replies","Quotes","Clients"];
const src=SR.map(s=>{const a=L.filter(l=>l.source==s),w=a.filter(l=>l.stage==6);return[s,a.length,c(a,2),c(a,4),w.length,w.reduce((t,l)=>t+val(l),0)]}).filter(r=>r[1]);
return`<h2>Analytics</h2><h3>This month</h3><div class="grid">${d.map((n,i)=>`<div class="card"><span class="big">${n}</span><div class="mu">${lb[i]}</div></div>`).join("")}<div class="card"><span class="big">$${rev}</span><div class="mu">Revenue</div></div></div>
<h3>Conversion (this month)</h3><div class="grid">${[["Lead → Reply",d[2],d[0]],["Reply → Quote",d[3],d[2]],["Quote → Client",d[4],d[3]],["Lead → Client",d[4],d[0]]].map(r=>`<div class="card"><span class="big">${pc(r[1],r[2])}</span><div class="mu">${r[0]} (${r[1]}/${r[2]})</div></div>`).join("")}</div>
<h3>By source (all time)</h3><div class="card" style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr class="mu" style="text-align:left"><th>Source</th><th>Leads</th><th>Replies</th><th>Quotes</th><th>Clients</th><th>Revenue</th></tr>${src.map(r=>`<tr>${r.map((x,i)=>`<td style="padding:5px 0">${i==5?"$":""}${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>`}
function tpl(){return`<h2>DM Templates</h2><p class="mu">Variables: {client} {game} {deadline}. Edits save automatically.</p>${Object.keys(S.tpl).map(k=>`<h3>${k}</h3><textarea oninput="S.tpl['${k}']=this.value;save()">${esc(S.tpl[k])}</textarea>`).join("")}`}
function set(){return`<h2>CRM Settings</h2><div class="card" style="max-width:420px"><p class="mu">Defaults for Quick Add (also learned automatically from your last entry).</p><label>Platform</label><select onchange="S.pref.platform=this.value;save()">${opts(PL,S.pref.platform)}</select><label>Source</label><select onchange="S.pref.source=this.value;save()">${opts(SR,S.pref.source)}</select></div>`}
function data(){return`<h2>Data</h2><div class="card" style="max-width:520px"><p class="mu">Your data is stored privately in this browser only. Export regularly as a backup.</p><div class="row"><button onclick="expJ()">Export JSON</button><button onclick="expC()">Export CSV</button><button onclick="$('#imp').click()">Import JSON / CSV</button><input id="imp" type="file" accept=".json,.csv" hidden onchange="imp(this.files[0])"></div></div>`}
const stub=t=>`<h2>${t}</h2><div class="card mu">Not included in this lean first build. Ask me to add it and I'll build it next.</div>`;
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function expJ(){dl("jelann-crm.json",JSON.stringify(S,null,2),"application/json")}
const K=["name","project","platform","contact","source","stage","pkg","value","deadline","follow","discord","x","email","web","base","rush","rev","paid","created"];
function expC(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';dl("jelann-leads.csv",[K.concat("notes").join(",")].concat(S.leads.map(l=>K.map(k=>q(k=="stage"?ST[l.stage]:l[k])).concat(q(l.notes.map(n=>n.t).join(" | "))).join(","))).join("\n"),"text/csv")}
function csv(t){const r=[];let row=[],c="",q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=0;else c+=ch}else if(ch=='"')q=1;else if(ch==","){row.push(c);c=""}else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}
function imp(f){if(!f)return;f.text().then(t=>{try{if(f.name.endsWith(".json")){const o=JSON.parse(t);S=Object.assign(S,o)}else{const r=csv(t),h=r.shift();r.forEach(a=>{const o={};h.forEach((k,i)=>o[k]=a[i]);const l=mk({});K.forEach(k=>{if(o[k]!=null)l[k]=o[k]});l.stage=Math.max(0,ST.indexOf(o.stage));l.max=l.stage%7;if(o.notes)l.notes=o.notes.split(" | ").map(x=>({d:TD(),t:x}))})}save();toast("Imported");draw()}catch(e){toast("Import failed")}})}
function quick(){modal(`<h2>Add Lead</h2><label>Command line (optional): Name | Project | Platform | Source | Notes</label><input id="cl" placeholder="Alex | Project Eclipse | Roblox | X | needs logo" oninput="parse(this.value)">
<div class="f2"><div><label>Name</label><input id="qn"></div><div><label>Game / Project</label><input id="qp"></div><div><label>Platform</label><select id="qf">${opts(PL,S.pref.platform)}</select></div><div><label>Contact</label><input id="qc" placeholder="@username"></div></div>
<label>Source</label><select id="qs">${opts(SR,S.pref.source)}</select><label>Notes</label><textarea id="qt" style="min-height:50px"></textarea>
<div class="row" style="margin-top:12px"><button class="pri" id="qa" onclick="qadd()">Add Lead</button><button onclick="closeM()">Cancel</button></div>`);setTimeout(()=>$("#cl").focus(),30);$("#ov").onkeydown=e=>{if(e.key=="Enter"&&e.target.tagName!="TEXTAREA"){e.preventDefault();qadd()}}}
function parse(v){const p=v.split(/\||,/).map(s=>s.trim()),m=(a,x)=>a.find(o=>o.toLowerCase().startsWith((x||"").toLowerCase())&&x)||a.find(o=>x&&o.toLowerCase().includes(x.toLowerCase()));
$("#qn").value=p[0]||"";$("#qp").value=p[1]||"";if(p[2]){const a=m(PL,p[2]);if(a)$("#qf").value=a}if(p[3]){const a=m(SR,p[3]);if(a)$("#qs").value=a}$("#qt").value=p.slice(4).join(", ")}
function qadd(){const n=$("#qn").value.trim(),p=$("#qp").value.trim();if(!n&&!p)return toast("Enter a name or project");const l=mk({name:n,project:p,platform:$("#qf").value,contact:$("#qc").value,source:$("#qs").value});S.pref.platform=l.platform;S.pref.source=l.source;const t=$("#qt").value.trim();if(t){l.notes.push({d:TD(),t});log(l,"Note added")}save();toast("Lead added");closeM();V=V=="dash"||V=="leads"?V:"leads";draw()}
function note(id){const l=G(id);modal(`<h2>Add Note</h2><textarea id="nt" placeholder="Likes bold typography. Needs logo before Oct 15…"></textarea><div class="row" style="margin-top:10px"><button class="pri" onclick="G(${id}).notes.push({d:TD(),t:$('#nt').value});log(G(${id}),'Note added');save();closeM();open_(${id},1)">Save</button></div>`);$("#nt").focus()}
function fup(id){const b=(t,d)=>`<button onclick="setF(${id},'${d}')">${t}</button>`;modal(`<h2>Next follow-up</h2><div class="row">${b("Tomorrow",add(1))}${b("3 days",add(3))}${b("1 week",add(7))}<input type="date" id="fd" style="width:auto" onchange="setF(${id},this.value)">${b("Clear","")}</div>`)}
function setF(id,d){const l=G(id);l.follow=d;log(l,d?"Follow-up set for "+fd(d):"Follow-up cleared");save();closeM()}
function open_(id){const l=G(id);if(!l)return;const f=(k,lab,t)=>`<div><label>${lab}</label><input ${t?`type="${t}"`:""} value="${esc(l[k])}" onchange="G(${id}).${k}=this.value;save()"></div>`;
const sel=(k,lab,a)=>`<div><label>${lab}</label><select onchange="G(${id}).${k}=this.value;save()">${opts(a,l[k])}</select></div>`;
modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(l.name||"Lead")} ${l.project?"— "+esc(l.project):""}</h2><button onclick="closeM()">✕</button></div>
<div class="row" style="margin:10px 0"><select style="width:auto" onchange="mv(G(${id}),this.value);open_(${id})">${ST.map((s,i)=>`<option value="${i}" ${i==l.stage?"selected":""}>${s}</option>`).join("")}</select>${fuBadge(l)}<button class="sm" onclick="fup(${id})">Follow-up</button><button class="sm" onclick="note(${id})">+ Add Note</button>
<select id="dmt" style="width:auto">${opts(Object.keys(S.tpl))}</select><button class="sm" onclick="dm(G(${id}),$('#dmt').value)">Copy DM</button></div>
<h3>Contact</h3><div class="f2">${f("name","Name")}${f("contact","Username")}${sel("platform","Platform",PL)}${f("discord","Discord")}${f("x","X / Twitter")}${f("email","Email")}${f("web","Website")}${sel("source","Source",SR)}</div>
<h3>Project</h3><div class="f2">${f("project","Game name")}${f("genre","Genre")}${f("gstage","Game stage")}${f("deadline","Deadline","date")}</div>
<h3>Opportunity</h3><div class="f2">${sel("pkg","Package",["","Standard — $90","Professional — $150","Custom"])}${f("value","Potential value ($)","number")}</div>
${l.stage==6?`<h3>Revenue</h3><div class="f2">${f("base","Base price","number")}${f("rush","Rush fee","number")}${f("rev","Additional revisions","number")}${f("deposit","Amount paid","number")}${sel("pay","Payment status",["Unpaid","Deposit paid","Fully paid"])}</div><p>Total <b>$${tot(l)}</b> · Remaining <b>$${Math.max(0,tot(l)-(+l.deposit||0))}</b></p>`:""}
<h3>Notes</h3>${l.notes.map(n=>`<div class="card" style="margin-bottom:6px"><span class="mu">${fd(n.d)}</span><br>${esc(n.t)}</div>`).join("")||'<span class="mu">No notes.</span>'}
<h3>Activity</h3><div class="tl">${l.log.map(e=>`<div><b>${fd(e.d)}</b> — ${esc(e.t)}</div>`).join("")}</div>
<div class="row" style="margin-top:14px"><button onclick="if(confirm('Delete lead?')){S.leads=S.leads.filter(x=>x.id!=${id});save();closeM()}">Delete</button></div>`)}
function search(){modal(`<input id="gs" placeholder="Search everything…" oninput="gsr(this.value)"><div id="gr" class="list" style="margin-top:8px"></div>`);$("#gs").focus()}
function gsr(q){q=q.toLowerCase();$("#gr").innerHTML=q?S.leads.filter(l=>JSON.stringify(l).toLowerCase().includes(q)).slice(0,10).map(l=>`<div style="cursor:pointer" onclick="open_(${l.id})"><span><b>${esc(l.name)}</b> ${esc(l.project)}</span><span class="pill">${ST[l.stage]}</span></div>`).join("")||'<span class="mu">No results</span>':""}

const CR=["concept","composition","typography","shape","originality","technical","readability","suitability"],CL=["Concept","Composition","Typography","Shape Language","Originality","Technical Execution","Readability","Game Suitability"];
let P={old:[],new:[],res:S.prog||null,busy:"",err:""};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,med=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2},sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))},r1=x=>(Math.round(x*10)/10).toFixed(1);
const ovr=x=>mean(CR.map(k=>+x.scores[k]||0));
function pick(g,fl){P[g]=[...fl].slice(0,10).map(f=>({f,u:URL.createObjectURL(f)}));draw()}
async function runProg(){P.err="";if(P.old.length<3||P.new.length<3){P.err="Add at least 3 logos to each group.";return draw()}
let sm;try{sm=await claude.use("sample")}catch(e){}
if(!sm){P.err="AI analysis isn't available in this view.";return draw()}
const lim=await sm.limits().catch(()=>null);if(!lim||!lim.images){P.err="Image analysis isn't available in this view.";return draw()}
try{const res={};
for(const g of["old","new"]){P.busy="Analyzing "+(g=="old"?"older":"recent")+" work…";draw();const fs=P[g].slice(0,lim.images.maxCount).map(x=>x.f),n=fs.length;
res[g]=await sm.json(`You are assessing ${n} game-logo images from a solo designer's ${g=="old"?"OLDER":"RECENT"} work, in order (image 1 first). For each, give a structured, subjective assessment from 0-10 (one decimal; use the full range and be honest and critical) for: concept, composition, typography, shape (shape language), originality, technical (technical execution), readability, suitability (fit for game use: scalability, thumbnail legibility, genre fit). Add "note": one concrete sentence. Return ONLY a JSON array of ${n} objects: {"scores":{"concept":0,"composition":0,"typography":0,"shape":0,"originality":0,"technical":0,"readability":0,"suitability":0},"note":"..."}`,{images:fs})}
P.busy="Building comparison…";draw();
const sum=g=>CR.map(k=>k+": mean "+r1(mean(res[g].map(x=>+x.scores[k]||0)))+", best "+r1(Math.max(...res[g].map(x=>+x.scores[k]||0)))).join("; ")+"\nNotes: "+res[g].map(x=>x.note).join(" | ");
res.syn=await sm.json(`Compare a game-logo designer's OLDER work vs RECENT work using these AI-assisted subjective assessments (0-10).\nOLDER — ${sum("old")}\nRECENT — ${sum("new")}\nDo NOT assume recent work is better; report regressions and plateaus honestly if the data or notes show them. Return ONLY JSON: {"improvements":[string],"plateaus":[string],"regressions":[string],"gaps":[string],"plan":[{"week":"Week 1","focus":string,"tasks":[string]}]}. Use concise, specific strings; use [] where none apply; plan has 4 weeks (30 days), 2-4 tasks each, targeting the biggest gaps.`,{modelTier:"complex"});
P.res=res;S.prog=res;save();P.busy=""}catch(e){P.busy="";P.err=e.code=="not_granted"?"Permission declined.":"Analysis failed ("+(e.code||"error")+"). Try again with fewer or smaller images."}draw()}
function zone(g,t){return`<div class="card"><b>${t}</b> <span class="mu">3–10 logos</span><div class="row" style="margin:8px 0"><button onclick="$('#f_${g}').click()">Choose images</button><input id="f_${g}" type="file" accept="image/*" multiple hidden onchange="pick('${g}',this.files)"><span class="mu">${P[g].length} selected</span></div><div class="row">${P[g].map(x=>`<img src="${x.u}" style="width:64px;height:64px;object-fit:contain;background:var(--pn2);border:1px solid var(--bd);border-radius:6px">`).join("")}</div></div>`}
function prog(){const r=P.res;let h=`<h2>Progression Analyzer</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${zone("old","Older work")}${zone("new","Recent work")}</div><div class="row" style="margin:12px 0"><button class="pri" ${P.busy?"disabled":""} onclick="runProg()">${P.busy||"Analyze"}</button>${P.err?`<span class="due">${esc(P.err)}</span>`:""}</div><p class="mu">Scores are structured AI-assisted assessments (0–10), not objective measurements. Recent work isn't assumed to be better.</p>`;
if(!r)return h;const A=g=>r[g].map(x=>ovr(x)),o=A("old"),n=A("new"),c=(g,k)=>r[g].map(x=>+x.scores[k]||0),dl=x=>`<span style="color:${x>0.3?"var(--gn)":x<-0.3?"var(--rd)":"var(--mu)"}">${x>0?"+":""}${r1(x)}</span>`;
h+=`<h3>Comparison</h3><div class="card" style="overflow:auto"><table style="width:100%;border-collapse:collapse;white-space:nowrap"><tr class="mu" style="text-align:left"><th></th><th>Old avg</th><th>Recent avg</th><th>Δ</th><th>Old median</th><th>Recent median</th><th>Old best</th><th>Recent best</th></tr>`+
CR.map((k,i)=>[CL[i],c("old",k),c("new",k)]).concat([["Overall",o,n]]).map(([t,a,b],i)=>`<tr style="${i==8?"font-weight:600;border-top:1px solid var(--bd)":""}"><td style="padding:5px 8px 5px 0">${t}</td><td>${r1(mean(a))}</td><td>${r1(mean(b))}</td><td>${dl(mean(b)-mean(a))}</td><td>${r1(med(a))}</td><td>${r1(med(b))}</td><td>${r1(Math.max(...a))}</td><td>${r1(Math.max(...b))}</td></tr>`).join("")+`</table></div>
<p class="mu">Consistency (std. dev. of overall score, lower = more consistent): older ${r1(sd(o))} · recent ${r1(sd(n))}</p>`;
const y=r.syn||{},L=(t,a)=>`<div class="card"><b>${t}</b><ul style="margin:6px 0 0;padding-left:18px">${(a||[]).map(x=>`<li>${esc(x)}</li>`).join("")||'<li class="mu">None found</li>'}</ul></div>`;
h+=`<h3>Findings</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${L("Improvements",y.improvements)}${L("Plateaus",y.plateaus)}${L("Regressions",y.regressions)}${L("Skill gaps",y.gaps)}</div><h3>30-day practice plan</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${(y.plan||[]).map(w=>`<div class="card"><b>${esc(w.week)}: ${esc(w.focus)}</b><ul style="margin:6px 0 0;padding-left:18px">${(w.tasks||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>`;
h+=["old","new"].map(g=>`<h3>Individual analysis — ${g=="old"?"older":"recent"}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${r[g].map((x,i)=>`<div class="card">${P[g][i]?`<img src="${P[g][i].u}" style="width:100%;height:110px;object-fit:contain;background:var(--pn2);border-radius:6px">`:""}<div><b>#${i+1} · ${r1(ovr(x))}</b></div><div class="mu">${CR.map((k,j)=>CL[j].split(" ")[0]+" "+r1(+x.scores[k]||0)).join(" · ")}</div><div>${esc(x.note)}</div></div>`).join("")}</div>`).join("");
return h}

let PR={files:[],cur:(S.reviews||[])[0]||null,busy:"",err:"",goal:"Roblox and indie game developers who need a game logo"};
function pickR(fl){PR.files=[...fl].slice(0,12).map(f=>({f,u:URL.createObjectURL(f)}));draw()}
async function runPR(){PR.err="";if(PR.files.length<3){PR.err="Add at least 3 pieces.";return draw()}
let sm;try{sm=await claude.use("sample")}catch(e){}
if(!sm){PR.err="AI review isn't available in this view.";return draw()}
const lim=await sm.limits().catch(()=>null);if(!lim||!lim.images){PR.err="Image analysis isn't available in this view.";return draw()}
PR.busy="Reviewing…";draw();
try{const fs=PR.files.slice(0,lim.images.maxCount).map(x=>x.f),n=fs.length,g=($("#pg")||{}).value||PR.goal;PR.goal=g;
const r=await sm.json(`You are a candid art director reviewing a solo game-logo designer's portfolio of ${n} pieces (numbered in order, image 1 first). Target clients: ${g}. Judge it as a portfolio that must win those clients, not just piece by piece. Return ONLY JSON: {"verdict":"2 sentence overall take","cohesion":{"score":0-10,"note":string},"clientAppeal":{"score":0-10,"note":string},"strengths":[string],"weaknesses":[string],"order":[{"piece":1,"action":"lead|keep|cut","why":string}],"gaps":[string],"actions":[string]}. "order" must have one entry per piece; "gaps" = styles, genres or proof a client would expect but is missing; "actions" = 3-5 prioritized, specific fixes. These are subjective AI-assisted assessments; be honest, not flattering.`,{images:fs,modelTier:"complex"});
r.date=TD();r.n=n;r.goal=g;r.thumbs=PR.files.slice(0,n).map(x=>x.u);PR.cur=r;const h=Object.assign({},r);delete h.thumbs;S.reviews=[h].concat(S.reviews||[]).slice(0,10);save();PR.busy=""}catch(e){PR.busy="";PR.err=e.code=="not_granted"?"Permission declined.":"Review failed ("+(e.code||"error")+"). Try fewer or smaller images."}draw()}
function port(){const r=PR.cur,L=(t,a)=>`<div class="card"><b>${t}</b><ul style="margin:6px 0 0;padding-left:18px">${(a||[]).map(x=>`<li>${esc(x)}</li>`).join("")||'<li class="mu">None</li>'}</ul></div>`;
let h=`<h2>Portfolio Reviews</h2><div class="card"><b>Portfolio pieces</b> <span class="mu">3–12 images, your current best work</span><label class="mu" style="display:block;margin:8px 0 3px">Who is this portfolio for?</label><input id="pg" value="${esc(PR.goal)}"><div class="row" style="margin:8px 0"><button onclick="$('#pf').click()">Choose images</button><input id="pf" type="file" accept="image/*" multiple hidden onchange="PR.goal=$('#pg').value;pickR(this.files)"><span class="mu">${PR.files.length} selected</span></div><div class="row">${PR.files.map((x,i)=>`<span style="position:relative"><img src="${x.u}" style="width:64px;height:64px;object-fit:contain;background:var(--pn2);border:1px solid var(--bd);border-radius:6px"><span class="pill" style="position:absolute;left:2px;top:2px;background:var(--bg)">${i+1}</span></span>`).join("")}</div></div><div class="row" style="margin:12px 0"><button class="pri" ${PR.busy?"disabled":""} onclick="runPR()">${PR.busy||"Review portfolio"}</button>${PR.err?`<span class="due">${esc(PR.err)}</span>`:""}</div><p class="mu">Structured AI-assisted assessment, not an objective measurement. Numbers follow the order you selected.</p>`;
if(!r)return h;const sc=(t,o)=>o?`<div class="card"><span class="big">${r1(+o.score||0)}</span><div class="mu">${t}</div><div>${esc(o.note)}</div></div>`:"";
const ac={lead:"var(--gn)",keep:"var(--mu)",cut:"var(--rd)"};
h+=`<h3>Verdict · ${fd(r.date)} · ${r.n} pieces</h3><div class="card">${esc(r.verdict)}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:10px">${sc("Cohesion",r.cohesion)}${sc("Client appeal",r.clientAppeal)}</div>
<h3>Piece order</h3><div class="card list">${(r.order||[]).map(o=>`<div><span>${r.thumbs&&r.thumbs[o.piece-1]?`<img src="${r.thumbs[o.piece-1]}" style="width:36px;height:36px;object-fit:contain;vertical-align:middle;margin-right:8px;background:var(--pn2);border-radius:4px">`:""}<b>#${o.piece}</b> <span class="mu">${esc(o.why)}</span></span><span class="pill" style="color:${ac[o.action]||"var(--mu)"}">${esc(o.action)}</span></div>`).join("")}</div>
<h3>Findings</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${L("Strengths",r.strengths)}${L("Weaknesses",r.weaknesses)}${L("Missing / gaps",r.gaps)}${L("Do next",r.actions)}</div>`;
if((S.reviews||[]).length>1)h+=`<h3>Past reviews</h3><div class="card list">${S.reviews.map((x,i)=>`<div style="cursor:pointer" onclick="PR.cur=S.reviews[${i}];draw()"><span>${fd(x.date)} · ${x.n} pieces</span><span class="mu">Cohesion ${r1(+x.cohesion?.score||0)} · Appeal ${r1(+x.clientAppeal?.score||0)}</span></div>`).join("")}</div>`;
return h}
function draw(keep){const f=document.activeElement,id=f&&f.tagName=="INPUT"&&keep?1:0;nav();$("#main").innerHTML=({dash,leads,clients,fu,an,tpl,set,data,prog,port})[V]();if(id){const i=$("#main input");i.focus();i.setSelectionRange(99,99)}}
document.addEventListener("keydown",e=>{const t=e.target.tagName;if((e.ctrlKey||e.metaKey)&&e.key=="k"){e.preventDefault();search()}else if(e.key=="Escape")closeM();else if(e.key.toLowerCase()=="n"&&!e.ctrlKey&&!e.metaKey&&!["INPUT","TEXTAREA","SELECT"].includes(t)){e.preventDefault();quick()}});
draw();
</script></body></html>
